name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - "launcher.py"
      - "tradebot.spec"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build TradeBot
        run: python -m PyInstaller --noconfirm --clean tradebot.spec

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\TradeBot.exe release\TradeBot.exe
          Set-Content -Path release\README.txt -Value @"
          TradeBot AI Windows Edition

          Start: TradeBot.exe
          Live market data: Binance public market-data API
          Trading: PAPER TRADING ONLY
          Data directory: %LOCALAPPDATA%\TradeBotAI\data
          Models directory: %LOCALAPPDATA%\TradeBotAI\models
          "@

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeBot-Windows-x64
          path: release/
          if-no-files-found: error
