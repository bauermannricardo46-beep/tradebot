name: Build and Release TRADENEX Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - "launcher.py"
      - "tradebot.spec"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      VERSION: 1.4.${{ github.run_number }}
      RELEASE_TAG: v1.4.${{ github.run_number }}
      APP_NAME: TRADENEX

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pillow

      - name: Python import preflight
        shell: pwsh
        run: |
          python -c "import app.demo, app.main; print('app.demo:', app.demo.__file__); print('app.main:', app.main.__file__)"
          if ($LASTEXITCODE -ne 0) { throw "Python import preflight failed" }

      - name: Run Python tests
        run: pytest -q

      - name: Generate TRADENEX Windows icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.open('web/tradenex-logo.png').convert('RGBA'); im.save('web/tradenex.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(24,24),(16,16)])"

      - name: Build TRADENEX
        run: python -m PyInstaller --noconfirm --clean --log-level=INFO tradebot.spec

      - name: Verify packaged modules
        shell: pwsh
        run: |
          if (!(Test-Path "dist\TRADENEX.exe")) { throw "TRADENEX.exe was not created" }
          python -c "from pathlib import Path; p=Path('dist/TRADENEX.exe'); print('EXE size:', p.stat().st_size); assert p.stat().st_size > 1000000"
          python -m PyInstaller.utils.cliutils.archive_viewer -l -b dist\TRADENEX.exe | Out-File packaged-modules.txt
          Select-String -Path packaged-modules.txt -Pattern "app.demo","app.main" -SimpleMatch
          if ($LASTEXITCODE -ne 0) { throw "app.demo/app.main not found in frozen archive" }

      - name: EXE startup smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\TRADENEX.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
            }
            if (!$ready) {
              if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
              throw "Frozen EXE did not expose /health within 20 seconds"
            }
            $health | ConvertTo-Json -Depth 8
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Prepare versioned release package
        shell: pwsh
        run: |
          $releaseDir = "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "dist\TRADENEX.exe" "$releaseDir\TRADENEX.exe"
          Set-Content -Path "$releaseDir\VERSION.txt" -Value $env:VERSION
          Set-Content -Path "$releaseDir\README.txt" -Value @"
          TRADENEX AI Windows Edition
          Version: $env:VERSION

          Start: TRADENEX.exe
          Live market data: Binance public market-data API
          Trading: PAPER TRADING / DEMO ONLY until exchange execution is explicitly configured
          Data directory: %LOCALAPPDATA%\TradeBotAI\data
          Models directory: %LOCALAPPDATA%\TradeBotAI\models
          "@
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "TRADENEX-Windows-x64-$env:VERSION.zip" -Force

      - name: Upload versioned workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRADENEX-Windows-x64-v${{ env.VERSION }}
          path: |
            release/
            TRADENEX-Windows-x64-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --title "TRADENEX $env:VERSION" `
            --generate-notes

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "TRADENEX-Windows-x64-$env:VERSION.zip",
            "release\TRADENEX.exe",
            "release\VERSION.txt",
            "release\README.txt"
          )
          foreach ($asset in $assets) {
            gh release upload "$env:RELEASE_TAG" $asset --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset: $asset"
            }
          }
