name: Build and Release TRADENEX Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - "launcher.py"
      - "tradebot.spec"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      VERSION: 1.4.${{ github.run_number }}
      RELEASE_TAG: v1.4.${{ github.run_number }}
      APP_NAME: TRADENEX

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pillow

      - name: Python import preflight
        shell: pwsh
        run: |
          python -c "import app.demo, app.main; print('app.demo:', app.demo.__file__); print('app.main:', app.main.__file__)"
          if ($LASTEXITCODE -ne 0) { throw "Python import preflight failed" }

      - name: Run Python tests
        run: pytest -q

      - name: Generate TRADENEX Windows icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.open('web/tradenex-logo.png').convert('RGBA'); im.save('web/tradenex.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(24,24),(16,16)])"

      - name: Build TRADENEX ONEDIR
        run: python -m PyInstaller --noconfirm --clean --log-level=INFO tradebot.spec

      - name: Verify ONEDIR package structure and runtime isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appDir = "dist\TRADENEX"
          $exePath = "$appDir\TRADENEX.exe"
          if (!(Test-Path $exePath)) { throw "TRADENEX.exe was not created at $exePath" }
          if (!(Test-Path "$appDir\_internal")) { throw "PyInstaller _internal directory is missing" }
          $exe = Get-Item $exePath
          Write-Host "EXE size: $($exe.Length) bytes"
          if ($exe.Length -le 100000) { throw "TRADENEX.exe is unexpectedly small or incomplete" }

          $pythonRuntime = Get-ChildItem $appDir -Recurse -File -Filter "Python.Runtime.dll" -ErrorAction SilentlyContinue
          if ($pythonRuntime) { throw "Python.Runtime.dll must not be present in the Windows build: $($pythonRuntime.FullName -join ', ')" }
          $pythonNet = Get-ChildItem $appDir -Recurse -File -Include "pythonnet*.dll","clr_loader*.dll" -ErrorAction SilentlyContinue
          if ($pythonNet) { throw "pythonnet/clr_loader artifacts must not be present in the Windows build: $($pythonNet.FullName -join ', ')" }
          Write-Host "No pywebview/pythonnet runtime artifacts detected"
          Write-Host "ONEDIR structure verified"

      - name: Smoke test clean ONEDIR build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workDir = (Resolve-Path "dist\TRADENEX").Path
          $proc = Start-Process -FilePath "$workDir\TRADENEX.exe" -WorkingDirectory $workDir -PassThru
          try {
            $ready = $false
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) {
                throw "TRADENEX.exe exited during startup with code $($proc.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
            }
            if (!$ready) { throw "ONEDIR EXE did not expose /health within 30 seconds" }
            if ($health.status -ne "ok") { throw "Health endpoint returned an invalid status" }
            if ($health.execution_mode -ne "DEMO") { throw "Unexpected default execution mode: $($health.execution_mode)" }

            $root = Invoke-RestMethod "http://127.0.0.1:8765/" -TimeoutSec 5
            if ($root.name -ne "TRADENEX") { throw "Root API returned unexpected application name" }

            $execution = Invoke-RestMethod "http://127.0.0.1:8765/execution" -TimeoutSec 5
            if ($execution.mode -ne "DEMO") { throw "Execution API returned unexpected mode" }

            $ai = Invoke-RestMethod "http://127.0.0.1:8765/ai/status" -TimeoutSec 5
            if ($null -eq $ai.SCALP -or $null -eq $ai.SWING) { throw "AI status endpoint is incomplete" }

            Write-Host "CLEAN ONEDIR STARTUP/API SMOKE TEST PASSED"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Milliseconds 500
          }

      - name: Prepare portable release package
        shell: pwsh
        run: |
          $releaseRoot = "release\TRADENEX"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          Copy-Item "dist\TRADENEX\*" $releaseRoot -Recurse -Force
          Set-Content -Path "release\VERSION.txt" -Value $env:VERSION
          Set-Content -Path "release\README.txt" -Value @"
          TRADENEX AI Windows Edition
          Version: $env:VERSION

          IMPORTANT: This is a portable ONEDIR build.
          Extract the complete ZIP and start TRADENEX\TRADENEX.exe.
          Do not move TRADENEX.exe out of the TRADENEX folder because the _internal folder is required.

          The desktop dashboard opens in the installed Microsoft Edge or Google Chrome app window.
          Live market data: Binance public market-data API
          Trading: PAPER TRADING / DEMO ONLY until exchange execution is explicitly configured
          Data directory: %LOCALAPPDATA%\TradeBotAI\data
          Models directory: %LOCALAPPDATA%\TradeBotAI\models
          "@
          Compress-Archive -Path "release\TRADENEX","release\VERSION.txt","release\README.txt" -DestinationPath "TRADENEX-Windows-x64-$env:VERSION.zip" -Force

      - name: Verify downloaded ZIP by extracting and launching it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $verifyDir = "zip-verify"
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          Expand-Archive -Path "TRADENEX-Windows-x64-$env:VERSION.zip" -DestinationPath $verifyDir -Force
          $exePath = (Resolve-Path "$verifyDir\TRADENEX\TRADENEX.exe").Path
          if (!(Test-Path $exePath)) { throw "EXE missing after ZIP extraction" }

          $runtimeDir = Split-Path $exePath
          $pythonRuntime = Get-ChildItem $runtimeDir -Recurse -File -Filter "Python.Runtime.dll" -ErrorAction SilentlyContinue
          if ($pythonRuntime) { throw "Python.Runtime.dll is present after ZIP extraction" }

          $proc = Start-Process -FilePath $exePath -WorkingDirectory $runtimeDir -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { throw "Extracted TRADENEX.exe exited with code $($proc.ExitCode)" }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
            }
            if (!$ready) { throw "Extracted release did not expose /health within 30 seconds" }
            Write-Host "DOWNLOADED ZIP EXTRACTION + STARTUP TEST PASSED"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Milliseconds 500
          }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash "TRADENEX-Windows-x64-$env:VERSION.zip" -Algorithm SHA256).Hash
          Set-Content -Path "SHA256SUMS.txt" -Value "$zipHash  TRADENEX-Windows-x64-$env:VERSION.zip"
          Write-Host "SHA256: $zipHash"

      - name: Upload versioned workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRADENEX-Windows-x64-v${{ env.VERSION }}
          path: |
            TRADENEX-Windows-x64-${{ env.VERSION }}.zip
            SHA256SUMS.txt
            release/VERSION.txt
            release/README.txt
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --title "TRADENEX $env:VERSION" `
            --generate-notes

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "TRADENEX-Windows-x64-$env:VERSION.zip",
            "SHA256SUMS.txt",
            "release\VERSION.txt",
            "release\README.txt"
          )
          foreach ($asset in $assets) {
            gh release upload "$env:RELEASE_TAG" $asset --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset: $asset"
            }
          }
