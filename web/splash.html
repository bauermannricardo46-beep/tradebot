<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADENEX AI</title><style>:root{--bg:#02040a;--cyan:#55e7ff;--violet:#8c5cff;--magenta:#ff39d1;--text:#f3f7ff;--muted:#69758f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(85,231,255,.07),transparent 24%),radial-gradient(circle at 70% 35%,rgba(255,57,209,.08),transparent 30%),#02040a;color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif}.scene{width:100vw;height:100vh;display:grid;place-items:center;position:relative}.scene:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(85,231,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(140,92,255,.03) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle at center,#000 0 35%,transparent 82%);animation:grid 7s linear infinite}.core{width:min(520px,78vw);aspect-ratio:1;position:relative;display:grid;place-items:center;z-index:2}.ring{position:absolute;border:1px solid rgba(85,231,255,.15);border-radius:50%;box-shadow:0 0 35px rgba(85,231,255,.05);animation:spin 9s linear infinite}.r1{inset:7%;border-top-color:var(--cyan);border-right-color:var(--magenta)}.r2{inset:15%;border-left-color:var(--violet);border-bottom-color:var(--cyan);animation-duration:13s;animation-direction:reverse}.r3{inset:26%;border-top-color:var(--magenta);border-bottom-color:transparent;animation-duration:17s}.scan{position:absolute;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),white,var(--magenta),transparent);box-shadow:0 0 18px rgba(85,231,255,.55);animation:scan 2.8s ease-in-out infinite}.logo{width:58%;max-width:360px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 28px rgba(85,231,255,.16)) drop-shadow(0 0 38px rgba(255,57,209,.09));animation:logoIn 1.7s cubic-bezier(.18,.82,.2,1) both,glow 3.2s ease-in-out 1.2s infinite alternate;transition:opacity .6s ease,filter .6s ease,transform .7s ease}.logo.dissolve{opacity:0;transform:scale(1.08);filter:blur(8px);pointer-events:none}.fallback{display:none;text-align:center;animation:logoIn 1.7s cubic-bezier(.18,.82,.2,1) both}.fallback .mark{width:104px;height:104px;margin:auto;border-radius:28px;border:1px solid rgba(85,231,255,.35);display:grid;place-items:center;background:linear-gradient(145deg,#0a1a2b,#140c22);font-size:34px;font-weight:950;letter-spacing:-.08em;box-shadow:inset 0 0 30px rgba(85,231,255,.13),0 0 55px rgba(85,231,255,.13)}.fallback h1{font-size:34px;letter-spacing:.2em;margin:20px 0 0}.fallback p{margin:8px 0 0;color:var(--muted);letter-spacing:.22em;font-size:10px}.brandline{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;transition:opacity .65s ease,transform .7s ease}.brandline.fade{opacity:0;transform:translate(-50%,18px)}.brandline h1{margin:0;font-size:clamp(30px,4vw,48px);letter-spacing:.22em;font-weight:950;text-shadow:0 0 24px rgba(85,231,255,.16)}.brandline p{margin:8px 0 0;color:#8b97ad;letter-spacing:.28em;font-size:10px}.status{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.16em;color:#5e6b84;display:flex;gap:9px;align-items:center;transition:opacity .5s ease}.status.fade{opacity:0}.status i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.2s ease-in-out infinite}.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:8}.particles b{position:absolute;width:2px;height:2px;background:var(--cyan);border-radius:50%;opacity:.45;animation:float var(--d,5s) linear infinite}.logo-particle-layer{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}.logo-particle{position:absolute;width:2px;height:2px;border-radius:50%;will-change:transform,opacity;box-shadow:0 0 8px currentColor}.dissolve-mode .ring{animation-play-state:paused;opacity:.18;transition:opacity .7s}.dissolve-mode .scan{opacity:0;transition:opacity .5s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateY(-170px);opacity:0}15%,85%{opacity:1}50%{transform:translateY(170px)}}@keyframes logoIn{0%{opacity:0;transform:scale(.72) translateY(14px);filter:blur(12px)}65%{opacity:1;transform:scale(1.03);filter:blur(0)}100%{transform:scale(1)}}@keyframes glow{from{filter:drop-shadow(0 0 18px rgba(85,231,255,.12)) drop-shadow(0 0 30px rgba(255,57,209,.05))}to{filter:drop-shadow(0 0 32px rgba(85,231,255,.24)) drop-shadow(0 0 44px rgba(255,57,209,.14))}}@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}@keyframes float{0%{transform:translate3d(0,20px,0);opacity:0}20%{opacity:.5}100%{transform:translate3d(0,-160px,0);opacity:0}}@keyframes grid{to{background-position:0 54px,54px 0}}@media(max-width:700px){.core{width:78vw}.brandline h1{font-size:28px;letter-spacing:.16em}.brandline p{font-size:8px}}</style></head><body><div class="scene"><div class="particles"><b></b><b></b><b></b><b></b><b></b><b></b></div><div id="logoParticleLayer" class="logo-particle-layer"></div><div class="core"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="scan"></div><img id="mainLogo" class="logo" src="./tradenex-logo.png" alt="TRADENEX"><div class="fallback"><div class="mark">NX</div><h1>TRADENEX</h1><p>AI TRADING INTELLIGENCE</p></div></div><div id="brandline" class="brandline"><h1>TRADENEX</h1><p>AI TRADING INTELLIGENCE</p></div><div id="status" class="status"><i></i><span id="statusText">INITIALIZING MARKET ENGINE</span></div></div><script>const steps=['INITIALIZING MARKET ENGINE','CONNECTING TO LIVE DATA','LOADING AI MODELS','STARTING ANALYSIS ENGINE','SYSTEM READY'];let i=0;const statusText=document.getElementById('statusText');const logo=document.getElementById('mainLogo');const scene=document.querySelector('.scene');const layer=document.getElementById('logoParticleLayer');const brandline=document.getElementById('brandline');const status=document.getElementById('status');let timer=setInterval(()=>{i=Math.min(i+1,steps.length-1);statusText.textContent=steps[i]},680);function fallback(){logo.style.display='none';document.querySelector('.fallback').style.display='block'}logo.onerror=fallback;async function dissolve(){scene.classList.add('dissolve-mode');brandline.classList.add('fade');status.classList.add('fade');await new Promise(r=>setTimeout(r,180));try{const rect=logo.getBoundingClientRect();const img=new Image();img.src=logo.src;await img.decode();const canvas=document.createElement('canvas');const size=90;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,size,size);const pixels=ctx.getImageData(0,0,size,size).data;const count=1050;const points=[];for(let n=0;n<count;n++){const px=Math.floor(Math.random()*size),py=Math.floor(Math.random()*size);const idx=(py*size+px)*4;if(pixels[idx+3]>75){points.push({x:px/size*rect.width+rect.left,y:py/size*rect.height+rect.top,c:`rgb(${pixels[idx]},${pixels[idx+1]},${pixels[idx+2]})`,vx:(Math.random()-.5)*1.2,vy:-(.6+Math.random()*1.8),spin:(Math.random()-.5)*.06,life:.75+Math.random()*.55,size:1+Math.random()*2.2})}}for(const p of points){const el=document.createElement('i');el.className='logo-particle';el.style.left=`${p.x}px`;el.style.top=`${p.y}px`;el.style.width=`${p.size}px`;el.style.height=`${p.size}px`;el.style.color=p.c;el.style.background=p.c;layer.appendChild(el);let start=performance.now();const dur=900+Math.random()*900;const anim=now=>{const t=Math.min(1,(now-start)/dur);el.style.transform=`translate(${p.vx*t*120+Math.sin(t*8+p.x)*4}px,${p.vy*t*420-130*t*t}px) rotate(${p.spin*now*10}deg) scale(${1-t*.45})`;el.style.opacity=String((1-t)*p.life);if(t<1)requestAnimationFrame(anim);else el.remove()};requestAnimationFrame(anim)}logo.classList.add('dissolve')}catch{logo.classList.add('dissolve')}await new Promise(r=>setTimeout(r,1450));clearInterval(timer);location.replace('/index.html')}setTimeout(dissolve,3600)</script></body></html>
