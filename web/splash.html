<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADENEX AI</title><style>:root{--bg:#02040a;--cyan:#55e7ff;--violet:#8c5cff;--magenta:#ff39d1;--text:#f3f7ff;--muted:#69758f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(85,231,255,.07),transparent 24%),radial-gradient(circle at 70% 35%,rgba(255,57,209,.08),transparent 30%),#02040a;color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif}body:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(85,231,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(140,92,255,.03) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle at center,#000 0 35%,transparent 82%);animation:grid 7s linear infinite}.scene{width:100vw;height:100vh;display:grid;place-items:center;position:relative}.core{width:min(520px,78vw);aspect-ratio:1;position:relative;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(85,231,255,.15);border-radius:50%;box-shadow:0 0 35px rgba(85,231,255,.05);animation:spin 9s linear infinite}.r1{inset:7%;border-top-color:var(--cyan);border-right-color:var(--magenta)}.r2{inset:15%;border-left-color:var(--violet);border-bottom-color:var(--cyan);animation-duration:13s;animation-direction:reverse}.r3{inset:26%;border-top-color:var(--magenta);border-bottom-color:transparent;animation-duration:17s}.scan{position:absolute;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),white,var(--magenta),transparent);box-shadow:0 0 18px rgba(85,231,255,.55);animation:scan 2.8s ease-in-out infinite}.logo{width:58%;max-width:360px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 28px rgba(85,231,255,.16)) drop-shadow(0 0 38px rgba(255,57,209,.09));animation:logoIn 1.7s cubic-bezier(.18,.82,.2,1) both,glow 3.2s ease-in-out 1.2s infinite alternate}.fallback{display:none;text-align:center;animation:logoIn 1.7s cubic-bezier(.18,.82,.2,1) both}.fallback .mark{width:104px;height:104px;margin:auto;border-radius:28px;border:1px solid rgba(85,231,255,.35);display:grid;place-items:center;background:linear-gradient(145deg,#0a1a2b,#140c22);font-size:34px;font-weight:950;letter-spacing:-.08em;box-shadow:inset 0 0 30px rgba(85,231,255,.13),0 0 55px rgba(85,231,255,.13)}.fallback h1{font-size:34px;letter-spacing:.2em;margin:20px 0 0}.fallback p{margin:8px 0 0;color:var(--muted);letter-spacing:.22em;font-size:10px}.brandline{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.brandline h1{margin:0;font-size:clamp(30px,4vw,48px);letter-spacing:.22em;font-weight:950;text-shadow:0 0 24px rgba(85,231,255,.16)}.brandline p{margin:8px 0 0;color:#8b97ad;letter-spacing:.28em;font-size:10px}.status{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.16em;color:#5e6b84;display:flex;gap:9px;align-items:center}.status i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.2s ease-in-out infinite}.particles{position:absolute;inset:0;overflow:hidden}.particles b{position:absolute;width:2px;height:2px;background:var(--cyan);border-radius:50%;opacity:.45;animation:float var(--d,5s) linear infinite}.particles b:nth-child(1){left:18%;top:32%;--d:6s}.particles b:nth-child(2){left:82%;top:27%;--d:7s}.particles b:nth-child(3){left:24%;top:72%;--d:5.5s}.particles b:nth-child(4){left:76%;top:68%;--d:8s}.particles b:nth-child(5){left:11%;top:51%;--d:6.8s}.particles b:nth-child(6){left:90%;top:48%;--d:5.2s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateY(-170px);opacity:0}15%,85%{opacity:1}50%{transform:translateY(170px)}}@keyframes logoIn{0%{opacity:0;transform:scale(.72) translateY(14px);filter:blur(12px)}65%{opacity:1;transform:scale(1.03);filter:blur(0)}100%{transform:scale(1)}}@keyframes glow{from{filter:drop-shadow(0 0 18px rgba(85,231,255,.12)) drop-shadow(0 0 30px rgba(255,57,209,.05))}to{filter:drop-shadow(0 0 32px rgba(85,231,255,.24)) drop-shadow(0 0 44px rgba(255,57,209,.14))}}@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}@keyframes float{0%{transform:translate3d(0,20px,0);opacity:0}20%{opacity:.5}100%{transform:translate3d(0,-160px,0);opacity:0}}@keyframes grid{to{background-position:0 54px,54px 0}}@media(max-width:700px){.core{width:78vw}.brandline h1{font-size:28px;letter-spacing:.16em}.brandline p{font-size:8px}}</style></head><body><div class="scene"><div class="particles"><b></b><b></b><b></b><b></b><b></b><b></b></div><div class="core"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="scan"></div><img class="logo" src="./tradenex-logo.png" alt="TRADENEX" onerror="this.style.display='none';document.querySelector('.fallback').style.display='block'"><div class="fallback"><div class="mark">NX</div><h1>TRADENEX</h1><p>AI TRADING INTELLIGENCE</p></div></div><div class="brandline"><h1>TRADENEX</h1><p>AI TRADING INTELLIGENCE</p></div><div class="status"><i></i><span id="statusText">INITIALIZING MARKET ENGINE</span></div></div><script>const steps=['INITIALIZING MARKET ENGINE','CONNECTING TO LIVE DATA','LOADING AI MODELS','STARTING ANALYSIS ENGINE','SYSTEM READY'];let i=0;const s=document.getElementById('statusText');const timer=setInterval(()=>{i=Math.min(i+1,steps.length-1);s.textContent=steps[i]},680);setTimeout(()=>{clearInterval(timer);location.replace('/index.html')},4600)</script></body></html>
